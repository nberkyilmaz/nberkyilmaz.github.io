<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Off the chart · Berk Yilmaz</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#081a35" />
    <!-- GitHub Pages serves this for any address on the domain that doesn't exist, at that address, so every
         link here starts from the root. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --night: #081a35;
        --sun: #ffc65c;
        --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
        color: #fff;
        font: 16px/1.65 var(--font);
        -webkit-font-smoothing: antialiased;
        background:
          radial-gradient(90% 35% at 50% 100%, rgba(255, 160, 110, 0.2) 0%, rgba(255, 160, 110, 0) 70%),
          linear-gradient(180deg, #040b1a 0%, #081a35 45%, #102a52 85%, #1d3561 100%);
      }
      body::before {
        content: '';
        position: absolute;
        inset: 0 0 30% 0;
        background-image:
          radial-gradient(1.5px 1.5px at 8% 22%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 18% 60%, #fff 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 31% 14%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 44% 40%, #fff 50%, transparent 51%),
          radial-gradient(2px 2px at 57% 18%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 66% 52%, #fff 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 74% 10%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 86% 34%, #fff 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 94% 16%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 4% 48%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 24% 34%, #fff 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 49% 27%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 70% 41%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 90% 57%, #fff 50%, transparent 51%);
      }
      a { color: inherit; }
      a:focus-visible {
        outline: 3px solid var(--sun);
        outline-offset: 3px;
        border-radius: 8px;
      }
      .hills { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: clamp(60px, 9vw, 130px); }
      .hills .far { fill: rgba(40, 30, 78, 0.55); }
      .hills .near { fill: #0b1424; }
      main { position: relative; z-index: 1; width: 100%; max-width: 40rem; padding: 3rem 16px 9rem; text-align: center; }
      .plane { width: 4.5rem; height: auto; margin: 0 auto 1.5rem; display: block; fill: #fff; transform: rotate(-12deg); }
      @media (prefers-reduced-motion: no-preference) {
        .plane { animation: hold 6s ease-in-out infinite; }
        @keyframes hold { 50% { transform: rotate(-12deg) translate(10px, -8px); } }
      }
      .kicker { margin: 0 0 0.6rem; color: var(--sun); font-size: 0.8rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.1; letter-spacing: -0.03em; font-weight: 800; }
      p { margin: 1rem auto 2rem; max-width: 34rem; color: rgba(255, 255, 255, 0.85); font-size: 1.05rem; }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem; }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.7rem 1.15rem;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.95rem;
        text-decoration: none;
        border: 1px solid transparent;
        transition: transform 0.15s ease, background-color 0.15s ease;
      }
      .btn:hover { transform: translateY(-1px); }
      .btn-sun { background: var(--sun); color: var(--night); box-shadow: 0 8px 24px rgba(255, 170, 70, 0.35); }
      .btn-sun:hover { background: #ffd47f; }
      .btn-glass { border-color: rgba(255, 255, 255, 0.45); background: rgba(255, 255, 255, 0.08); }
      .btn-glass:hover { background: rgba(255, 255, 255, 0.16); }
      .more { margin: 1.75rem 0 0; font-size: 0.92rem; color: rgba(255, 255, 255, 0.7); }
      .more a { font-weight: 700; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <svg class="plane" viewBox="-18 -14 36 28" aria-hidden="true">
        <path d="M17 0C17-1.6 15.6-2.4 14-2.4H4.5L-3.5-13H-7L-3-2.4H-11L-14-6.5H-17L-15 0L-17 6.5H-14L-11 2.4H-3L-7 13H-3.5L4.5 2.4H14C15.6 2.4 17 1.6 17 0Z" />
      </svg>
      <p class="kicker">404 · Off the chart</p>
      <h1>There's nothing at this address</h1>
      <p>The link may be old, or the address mistyped. Here's the way home.</p>
      <div class="actions">
        <a class="btn btn-sun" href="/">Back to nberkyilmaz.com</a>
        <a class="btn btn-glass" href="/resume.pdf">Résumé (PDF)</a>
      </div>
      <p class="more">Or open <a href="/departure-brief/">Departure Brief</a> or <a href="/hours-to-go/">Hours to Go</a>.</p>
    </main>
    <svg class="hills" viewBox="0 0 1440 140" preserveAspectRatio="none" aria-hidden="true">
      <path class="far" d="M0 78C180 40 320 50 480 70S820 30 1000 56S1300 38 1440 64V140H0Z" />
      <path class="near" d="M0 112C240 84 420 96 640 108S1060 82 1240 100S1400 104 1440 98V140H0Z" />
    </svg>
  </body>
</html>
